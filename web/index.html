<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0e1116" />
  <!-- connect-src ws: - SELF-CONTAINED RULE (PROJECT.md 2026-09-21):
       direct mode's feed link replaces the companion-radio link, so the
       page connects to the HOST NODE's ws:// address, not its own origin.
       Only ws:// is opened to the network; scripts/styles/forms stay self. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-BUFFY_COMPUTES_ME'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws:; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <title>MeshTech Scope</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Scope" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
</head>
<body>
  <header>
    <h1>MeshTech Scope</h1>
    <select id="source-mode" aria-label="Packet source">
      <option value="radio">Radio (BLE companion)</option>
      <option value="direct">Direct (meshtech-node)</option>
    </select>
    <span id="conn-state" data-state="disconnected">disconnected</span>
    <button id="connect" class="primary">Connect</button>
  </header>
  <main>
    <div class="inputrow">
      <input id="radio-name" placeholder="Radio name (optional, e.g. T-Beam)" />
    </div>
    <div class="inputrow" id="node-link-row" hidden>
      <input id="node-host" placeholder="Host node address (e.g. 192.168.12.145)" />
      <input id="node-token" type="password" placeholder="Data-door password (once)" />
      <button id="refresh-map">Request map refresh</button>
    </div>
    <div id="app-inner"></div>
    <div class="card">
      <h3>Event log</h3>
      <div id="log"></div>
    </div>
  </main>
  <script type="module" src="/src/main.ts"></script>
  <!-- Stage 1 (2026-09-22): the worker existed since the security
       review but was never REGISTERED, so the app was never
       installable. Register from the served origin only (sw.js is
       same-origin by definition); failure is logged, never fatal. -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch((err) =>
          console.warn("service worker registration skipped:", String(err)));
      });
    }
  </script>
</body>
</html>
